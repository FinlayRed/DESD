{% extends "core/base.html" %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="card" style="max-width: 36rem; margin: 0 auto;">
    <div class="stack">
        <div>
            <div class="eyebrow">Products</div>
            <h1>Delete {{ object.name }}?</h1>
            <p>This removes the product listing from your producer workspace.</p>
        </div>
        <form method="post" class="actions">
            {% csrf_token %}
            <button type="submit" class="primary">Delete product</button>
            <a href="{% url 'core:product-list' %}" class="btn secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
